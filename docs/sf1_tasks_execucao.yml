sprint: SF1
programa: Programa 1
epico: Fix
ace_resumo: |
  Hardening do rollout S35: catálogo assinado (manifest/hash publish/runtime), limites/SLO/alertas em runtime, RBAC e auditoria completa, observabilidade real e pilotos news_v2/contestacao_v0 via API/UI sem placeholders. Decisão GO/NO-GO explícita.
waves:
  - id: W0
    nome: Baseline e Manifesto
    ace_context:
      spec_refs: [Cap2, Cap3, Cap6]
      resumo: Filemap/migração 0036 ok, s35_slos.md fonte única, manifest assinado com hashes publish/runtime.
  - id: W1
    nome: Policies e Limites
    ace_context:
      spec_refs: [Cap2, Cap3, Cap4]
      resumo: Limites em runtime, negativos e policy_violation/hash drift bloqueando promo/rollback.
  - id: W2
    nome: API/Console & RBAC
    ace_context:
      spec_refs: [Cap2, Cap4, Cap5, Cap8, Cap9]
      resumo: actor/operation_id/catalog_hash obrigatórios, 4xx padronizados, auditoria completa, UI com polling curto e RBAC efetivo.
  - id: W3
    nome: Observabilidade Real
    ace_context:
      spec_refs: [Cap2, Cap3, Cap6, Cap7]
      resumo: /metrics + promtool, firing/resolution de alertas críticos, painel export JSON/PNG, script s35_g3_obs.sh sólido.
  - id: W4
    nome: Pilotos Reais
    ace_context:
      spec_refs: [Cap4, Cap5, Cap8, Cap9]
      resumo: news_v2 e contestacao_v0 via API/UI com promo/rollback, slo_breach simulado e hashes comparados.
  - id: W5
    nome: ORR e GO/NO-GO
    ace_context:
      spec_refs: [Cap2, Cap4, Cap6, Cap7]
      resumo: Scorecards, S35_metrics_summary, bundle completo, decisão GO/NO-GO (mocks/infra ausente => NO-GO).
