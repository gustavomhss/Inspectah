# ============================================================
# GATES DEFINITION
# ============================================================
gates:
  - id: G25
    name: "Contratos & Integracoes"
    criteria:
      - "OpenAPI/contratos completos e versionados"
      - "Contract tests cobrindo happy + erro (400, 403, 404)"
      - "Mudancas breaking bloqueadas"
    evidence:
      - "out/scorecards/S41_G25_contracts.json"
      - "out/evidence/S41_G25_contracts/checks.json"
      - "out/evidence/S41_G25_contracts/openapi_spec.yaml"

  - id: G26
    name: "CVI v1 (reputacao/incentivos)"
    criteria:
      - "Snapshots CVI com rep presente e provenance completo"
      - "cov_alta_infl >= 0.60"
      - "pct_atualizado >= 0.70"
      - "cvi_inexplicable_rate <= 0.35"
      - "6+ decisoes revisadas com coherence_label"
    evidence:
      - "out/scorecards/S41_G26_cvi.json"
      - "out/evidence/S41_G26_cvi/checks.json"
      - "out/evidence/S41_G26_cvi/snapshots_sample.json"
      - "out/evidence/S41_G26_cvi/coherence_review.json"

  - id: G27
    name: "Explicabilidade v2 (CVI-aware)"
    criteria:
      - "UI navega decisao -> steps -> evidencia -> CVI -> atores"
      - "Estados explicitos: no_data, hypothesis, stale, error"
      - "explain_p95_ms < 900ms"
      - "drill_levels >= 3"
    evidence:
      - "out/scorecards/S41_G27_explainability.json"
      - "out/evidence/S41_G27_explainability/checks.json"
      - "out/evidence/S41_G27_explainability/playwright_results/"

  - id: G28
    name: "Anti-captura & Auditoria"
    criteria:
      - "RBAC fail-closed testado (403 em rota protegida)"
      - "Audit log registra mudancas de parametro"
      - "2-person rule validado (proponente != aprovador)"
      - "p5_decision_concentration_hhi_norm calculavel"
      - "p5_capture_suspect_index >= 0.70 aciona alerta"
      - "Bundle de auditoria por decisao extraivel"
    evidence:
      - "out/scorecards/S41_G28_governance_audit.json"
      - "out/evidence/S41_G28_governance_audit/checks.json"
      - "out/evidence/S41_G28_governance_audit/audit_trail_sample.json"
      - "out/evidence/S41_G28_governance_audit/rbac_403_test.log"

  - id: G29
    name: "ORR / GO-NO-GO"
    criteria:
      - "G25-G28 PASS"
      - "SLAs S40-S43 MEDIDOS e dentro dos limites"
      - "GO/NO-GO 7/7 PASS"
    evidence:
      - "out/scorecards/S41_G29_orr.json"
      - "out/scorecards/S41_ORR.json"
      - "out/evidence/S41_G29_orr/sla_report.json"
      - "out/evidence/S41_G29_orr/go_no_go_7of7.json"
      - "out/evidence/S41_ORR_summary.txt"

# ============================================================
# SLAs S40-S43
# ============================================================
slas:
  - metric: "P1 Latencia"
    limit: "<= 1 min"
    measurement: "ingest -> disponivel"
  - metric: "P2 Precisao"
    limit: ">= 92%"
    measurement: "claims corretamente classificados"
  - metric: "P3 Decisao"
    limit: "<= 10 s"
    measurement: "tempo ate decisao"
  - metric: "P4 API"
    limit: "<= 100 ms"
    measurement: "latencia de endpoint"
  - metric: "Reversao"
    limit: "<= 4%"
    measurement: "taxa de reversoes"
  - metric: "Abuso"
    limit: "<= 1%"
    measurement: "taxa de abuso detectado"

# ============================================================
# GO/NO-GO 7/7
# ============================================================
go_no_go:
  required: 7
  criteria:
    - id: 1
      description: "Checklist 100% completo"
    - id: 2
      description: "Quadros de Guias referenciados em DecisionBlocks"
    - id: 3
      description: "Testes passando (regressao + novos)"
    - id: 4
      description: "SLAs dentro dos limites"
    - id: 5
      description: "Documentacao atualizada"
    - id: 6
      description: "E40.5 operando para transicoes criticas"
    - id: 7
      description: "Pre-condicoes eticas verificadas"

