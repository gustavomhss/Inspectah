sprint: S35
programa: 1
epico: 28

ace_resumo:
  objetivo_sprint: >
    Fechar E28 com governança avançada de fluxo: rollout progressivo/canary/teste percentual governado, catálogo versionado,
    integração flow_version_id para lógica/Truth, OracleOps v3 com SLO/incident por modo, pilotos notícias/contestação v0 com evidências e bundle (G0–G5).
  leitura_minima_spec:
    - Programa 1/Epico 28/Sprint 35/Capitulo 1/Capitulo 1.md
    - Programa 1/Epico 28/Sprint 35/Capitulo 2/Capitulo 2.md
    - Programa 1/Epico 28/Sprint 35/Capitulo 3/Capitulo 3.md
    - Programa 1/Epico 28/Sprint 35/Capitulo 4/Capitulo 4.md
  instrucoes_para_ace: >
    Trabalhe wave a wave usando apenas o ace_context da wave/task atual.
    Não invente fluxos/SLOs fora do recorte (news_v2, contestacao_v0). Indicadores/alertas fake proibidos.
    Cada operação de rollout/promoção/rollback deve ter flow_id/flow_version_id/mode e auditoria.

waves:
  - id: W0
    nome: "Grounding & G0"
    descricao: "Catalogo inicial (news_v2, contestacao_v0), limits/flags e script G0."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 35/Capitulo 2/Bloco 1.md
        - config/flow_catalog/news_v2.yaml
        - config/flow_catalog/contestacao_v0.yaml
        - config/flows_limits.yaml
        - config/feature_flags.yaml
      resumo_para_ace: >
        Confirme catálogo/limits/flags presentes e consistentes. Prepare script G0 para scorecard.
      observacoes_execucao: >
        Nada de rollout aqui; foco em arquivos e checagem automatizada.

  - id: W1
    nome: "Modelo/Rollout/Catálogo (G1)"
    descricao: "Migração 0036, rollout canary/teste percentual, catálogo enforced, limites/flags aplicados."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 35/Capitulo 2/Bloco 2.md
        - Programa 1/Epico 28/Sprint 35/Capitulo 3/Capitulo 3.md
      resumo_para_ace: >
        Aplique migração; implemente rollout/teste com policies por domínio; carregue/enforce catálogo; aplique limites/flags.
        Teste invariantes/limites via pytest e script G1.
      observacoes_execucao: >
        Rodar em DB limpo e pós-S34. Violações de limites/invariantes são STOP.

  - id: W2
    nome: "Console/API rollout (G2)"
    descricao: "Console/API para canary/teste/promoção/rollback com auditoria/RBAC e catálogo/hash expostos."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 35/Capitulo 2/Bloco 3.md
        - Programa 1/Epico 28/Sprint 35/Capitulo 3/Capitulo 3.md
      resumo_para_ace: >
        Implementar rotas e UI rollout (painel/dialog), auditoria de operações, exibição de catálogo/hash, ações de promoção/rollback/teste.
      observacoes_execucao: >
        IDs/mode obrigatórios em payloads/auditoria. G2 script valida 2xx/recorte.

  - id: W3
    nome: "Observabilidade rollout (G3)"
    descricao: "Métricas/logs/alertas rollout; painel s35_flow_rollout_overview; SLO rollout no cockpit."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 35/Capitulo 2/Bloco 3.md
        - observability/dashboards/s35_flow_rollout_overview.json
        - observability/alerts/s35/
      resumo_para_ace: >
        Emitir métricas rollout/canary/teste; configurar alertas; expor estado SLO rollout via API/UI. Painel não pode ficar vazio.
      observacoes_execucao: >
        Simule breaches/rollbacks para validar alertas/painel. G3 script checa métricas/alerts/painel.

  - id: W4
    nome: "Pilotos rollout (G4)"
    descricao: "Rodar pilotos (notícias, contestação v0) em canary/teste→promo/rollback, coletar evidências e bundle parcial."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 35/Capitulo 4/Capitulo 4.md
        - Programa 1/Epico 28/Sprint 35/Capitulo 5/Capitulo 5.md
      resumo_para_ace: >
        Executar fluxos governados com canary/teste, promoção/rollback, coletando dataset/ingest_log/exec_dump/rollout_timeline/metrics/logs/screenshots.
        Rodar scripts metrics_summary/bundle e workflow s35-gates.yml.
      observacoes_execucao: >
        Evidências para ambos fluxos. Sem evidência completa, G4 falha.

  - id: W5
    nome: "ORR & bundle final (G5)"
    descricao: "Conduzir ORR G0–G4, gerar scorecard final e bundle inspectah_s35_evidence_bundle.zip."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 35/Capitulo 5/Capitulo 5.md
        - Programa 1/Epico 28/Sprint 35/Capitulo 6/Capitulo 6.md
      resumo_para_ace: >
        Executar ORR com bundle/metrics_summary/scorecards; registrar GO/NO-GO e riscos; empacotar bundle final.
      observacoes_execucao: >
        Bundle final deve passar unzip -t; registrar caminho no scorecard G5.

tasks:
  - id: S35-DOC-000
    wave: W0
    area: docs
    gate_relacionado: S35_G0
    descricao: "Fechar catálogo inicial (news_v2, contestacao_v0), limits/flags e SLO map rollout."
    arquivos_alvo:
      - config/flow_catalog/news_v2.yaml
      - config/flow_catalog/contestacao_v0.yaml
      - config/flows_limits.yaml
      - config/feature_flags.yaml
      - Programa 1/Epico 28/Sprint 35/Capitulo 1/*
      - Programa 1/Epico 28/Sprint 35/Capitulo 2/Bloco 1.md
    criterios_aceite:
      - "Catálogo presente e consistente; limits/flags definidos; SLO map alinhado."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 35/Capitulo 2/Bloco 1.md
      resumo_para_ace: >
        Sem catálogo/limits/flags prontos, não siga. Prepare base para G1.

  - id: S35-CI-001
