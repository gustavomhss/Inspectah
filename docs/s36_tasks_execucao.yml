sprint: S36
programa: 2
epico: "P2 - Interpretação, claims, entidades, sinais"

ace_resumo:
  objetivo_sprint: >
    Em domínios piloto, decisões de alto risco de comitês de agentes passam a ter
    traces estruturados (AgentTrace/CommitteeTrace/ReasoningStep) ligados a TR/DecisionRecords/claims,
    com canal oficial de feedback humano via Truth Console / Case Cockpit / Debunker e métricas básicas
    de cobertura, profundidade, uso e integridade de links (G0–G4).
  leitura_minima_spec:
    - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 1/Capitulo 1.md
    - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 2/Capitulo 2.md
    - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 3/Capitulo 3.md
    - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 4/Capitulo 4.md
    - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 5/Capitulo 5.md
  instrucoes_para_ace: >
    Trabalhe wave a wave usando apenas o ace_context da wave/task atual.
    Não expanda escopo além dos domínios/fluxos piloto definidos em S36-DOC-000.
    G0–G4 exigem evidências reais (traces, feedbacks, métricas, ORR), não simulações superficiais.

waves:
  - id: W0
    nome: "Grounding, modelo e contratos (G0)"
    descricao: "Fixar recorte piloto, consolidar objetos de trace/feedback e contratos de IDs/links com TR/DecisionRecord; mapear dependências P2‑E1/E2/E4/E7."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 1/Capitulo 1.md
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 2/Capitulo 2.md
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 3/Bloco 2.md
        - docs/Agents/Planejamento/Programa 2 - Interpretacao, claims, entidades, sinais.md
      resumo_para_ace: >
        Feche primeiro o recorte de domínios/fluxos piloto, depois a taxonomia/contratos de trace/feedback (G0).
        Sem esse grounding, instrumentar runtime ou UI vai gerar drift e theater.
      observacoes_execucao: >
        Não codar instrumentação aqui; foco é modelo, contratos de IDs e clareza de dependências.

  - id: W1
    nome: "Persistência, índices, PII & retenção"
    descricao: "Materializar o modelo em schemas/migrations, índices/constraints, política de PII/redaction e retenção para domínios piloto."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 2/Capitulo 2.md
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 3/Capitulo 3.md
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 4/Bloco 4.md
      resumo_para_ace: >
        Criar/ajustar schemas e repositórios de trace/feedback com PII/redaction e retenção embutidos,
        garantindo base sólida para instrumentação de runtime.
      observacoes_execucao: >
        Valide migrations em ambiente piloto. Testes de PII precisam usar dados simulados e serem documentados.

  - id: W2
    nome: "Instrumentação de runtime nos fluxos piloto"
    descricao: "Instrumentar ContentItem→Claim/Entidade→Comitê→TR→DecisionRecord para gerar traces completos e bem ligados, com métricas de coverage/overhead."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 2/Capitulo 2.md
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 5/Capitulo 5.md
      resumo_para_ace: >
        Ativar logging estruturado em pelo menos um fluxo A completo (ContentItem→DecisionRecord)
        e um recorte de Fluxo B (Debunker v0+sinais), atingindo coverage ≥80% e integridade de links (G1/G2).
      observacoes_execucao: >
        Meça coverage e link_breaks com scripts; não confie apenas em contagem manual.

  - id: W3
    nome: "UI, feedback humano e UX anti-teatro"
    descricao: "Expor traces em Truth Console/Case Cockpit/Debunker e habilitar FeedbackOnTrace/FeedbackOnDecision com UX utilizável."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 5/Capitulo 5.md
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 8/Capitulo 8.md
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 9/Capitulo 9.md
      resumo_para_ace: >
        Conectar backend de trace/feedback às UIs existentes, com visualização de trace legível e formulários
        de feedback estruturado, sem overload visual e respeitando PII.
      observacoes_execucao: >
        Consulte operadores cedo (S36-UX-010). Se ninguém quer usar a tela, há theater.

  - id: W4
    nome: "Métricas, riscos e ORR de auditabilidade"
    descricao: "Consolidar métricas e riscos de auditabilidade, revisar amostras qualitativamente e executar ORR G4."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 2/Capitulo 2.md
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 7/Capitulo 7.md
      resumo_para_ace: >
        Calcular trace_coverage_rate, avg_trace_depth, feedback_rate, trace_link_break_rate; revisar amostras
        para teatro/PII/overhead; rodar ORR G4 com GO/NO-GO e ações.
      observacoes_execucao: >
        Use scripts para métricas e documente ORR em arquivos sob out/scorecards/out/evidence.

