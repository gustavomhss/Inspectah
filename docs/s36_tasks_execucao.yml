      - "Cardinalidades e comportamento em reprocessamentos claros."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 2/Capitulo 2.md
      resumo_para_ace: >
        Mapear onde e como IDs serão gerados/propagados; isso guiará instrumentação em W2.

  - id: S36-GAP-001
    wave: W0
    area: planning
    gate_relacionado: ""
    descricao: "Mapear dependências críticas em P2‑E1/E2/E4/E7 e registrar gaps de Programa 2 que afetem S36."
    arquivos_alvo:
