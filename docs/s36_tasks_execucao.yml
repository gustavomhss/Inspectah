        Meça de verdade; theater de observabilidade aqui é perigoso.

  - id: S36-FE-010
    wave: W3
    area: frontend
    gate_relacionado: S36_G3
    descricao: "Exibir traces em Truth Console/Case Cockpit com visão de resumo+drill-down, respeitando PII."
    arquivos_alvo:
      - frontend/inspectah-ui/src/modules/console/pages/TruthConsolePage.tsx
      - frontend/inspectah-ui/src/modules/cases/pages/CaseTimelinePage.tsx
      - frontend/inspectah-ui/src/modules/cases/components/xray/CaseXRayLayout.tsx
    criterios_aceite:
      - "Operadores visualizam traces para decisões piloto com resumo claro e detalhes acessíveis."
      - "Nenhum campo PII proibido exibido."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 8/Capitulo 8.md
      resumo_para_ace: >
        Priorize legibilidade e foco; comece pelo resumo, não pelo dump bruto.

  - id: S36-FE-011
    wave: W3
    area: frontend
    gate_relacionado: S36_G3
    descricao: "Implementar formulário de feedback estruturado em Truth Console/Case Cockpit/Debunker."
    arquivos_alvo:
