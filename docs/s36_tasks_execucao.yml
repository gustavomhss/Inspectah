    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 2/Capitulo 2.md
      resumo_para_ace: >
        Use essas métricas para sustentar G2/G3 e alimentar ORR de auditabilidade.

  - id: S36-QA-021
    wave: W4
    area: qa_revisao_manual
    gate_relacionado: S36_G4
    descricao: "Revisar amostra de traces/feedbacks para avaliar profundidade, legibilidade e utilidade (anti-teatro)."
    arquivos_alvo:
