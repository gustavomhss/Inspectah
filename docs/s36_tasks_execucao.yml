      - app/agents/trace_repository.py
    criterios_aceite:
      - "Em domínios piloto, ≥80% dos casos elegíveis geram AgentTrace com ReasoningSteps mínimos."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 5/Capitulo 5.md
      resumo_para_ace: >
        Adicione logging estruturado em pontos chave do pipeline, usando repositório de trace de W1.

  - id: S36-BE-021
    wave: W2
    area: backend
    gate_relacionado: S36_G1
    descricao: "Instrumentar runtime de comitês/IEL e TR FSM para gerar CommitteeTrace ligado a AgentTrace/TR/DecisionRecord."
    arquivos_alvo:
      - app/agents/service.py
      - app/agents/repository.py
      - app/agents/flows/runtime_adapter.py
      - app/truth/models.py
      - app/truth/service.py
    criterios_aceite:
      - "CommitteeTraces gerados para ≥80% das decisões de alto risco em domínios piloto."
      - "Links a AgentTraces/TR/DecisionRecord válidos conforme contratos."
    ace_context:
      spec_refs:
