      resumo_para_ace: >
        Use IDs/contratos de W0; evite logging redundante ou inútil.

  - id: S36-BE-022
    wave: W2
    area: backend
    gate_relacionado: S36_G2
    descricao: "Garantir que DecisionRecords de alto risco em domínios piloto referenciem pelo menos um trace válido e implementar script de trace_link_break_rate."
    arquivos_alvo:
