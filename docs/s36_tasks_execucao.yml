  - id: S36-OPS-020
    wave: W4
    area: ops
    gate_relacionado: S36_G4
    descricao: "Preparar checklist e script base de ORR de auditabilidade de S36."
    arquivos_alvo:
      - bin/s36_g4_audit_orr.sh
      - docs/runbooks/S36_audit_orr_checklist.md
    criterios_aceite:
      - "Checklist e script prontos para consolidar métricas/riscos e apoiar ORR."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 2/Capitulo 2.md
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 7/Capitulo 7.md
      resumo_para_ace: >
        Crie a espinha dorsal do ORR, incluindo checagens de PII, overhead, coverage e uso real de feedback.

  - id: S36-OPS-021
    wave: W4
    area: ops
    gate_relacionado: S36_G4
    descricao: "Executar ORR de auditabilidade de S36, registrar GO/NO-GO e ações de follow-up."
