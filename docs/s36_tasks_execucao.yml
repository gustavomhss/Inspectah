    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2 - Interpretacao, claims, entidades, sinais.md
        - docs/Agents/Planejamento/Programa 2/Sprint 36/GAP_P2_E2_pipeline_data.md
