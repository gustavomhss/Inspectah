        Se faltar algo estrutural em P2‑E1/E2/E4/E7, registre gap; não tente consertar constituição via tasks locais.

  - id: S36-DOC-001
    wave: W0
    area: docs
    gate_relacionado: S36_G0
    descricao: "Consolidar documentação oficial do modelo canônico de trace/feedback e linkar na spec."
    arquivos_alvo:
