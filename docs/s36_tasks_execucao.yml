    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 3/Bloco 2.md
      resumo_para_ace: >
        Não mexa em código ainda; feche o modelo em docs/architecture com clareza de campos e relações.

  - id: S36-BE-002
    wave: W0
    area: backend
    gate_relacionado: S36_G0
    descricao: "Definir contratos de IDs/correlação entre TR/DecisionRecord/Claim e objetos de trace/feedback."
    arquivos_alvo:
