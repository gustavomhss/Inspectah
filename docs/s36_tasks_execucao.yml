    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 3/Bloco 2.md
      resumo_para_ace: >
        Traduza o modelo conceitual para tabelas reais com versionamento de schema.

  - id: S36-DB-011
    wave: W1
    area: dados/db
    gate_relacionado: S36_G1
    descricao: "Criar índices/constraints e política inicial de retenção/expurgo para traces/feedback em domínios piloto."
    arquivos_alvo:
      - db/migrations/026_sprint36_traces.sql
      - scripts/s14_migrations_and_cleanup.py
      - scripts/maintenance/s36_trace_retention.sh
    criterios_aceite:
      - "Consultas principais (por DecisionRecord/TR/domínio/período) com planos aceitáveis."
      - "Regras de retenção/expurgo documentadas e aplicáveis aos domínios piloto."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 4/Bloco 4.md
      resumo_para_ace: >
        Garanta que logging não exploda storage nem quebre SLOs; retention explícito desde o começo.

  - id: S36-SEC-010
    wave: W1
    area: seguranca
    gate_relacionado: S36_G4
    descricao: "Definir red/blacklist de PII e implementar redaction em traces/feedback (persistência e UI)."
    arquivos_alvo:
      - docs/DNA/Pilares/P2-*
      - docs/DNA/Pilares/P4-*
      - docs/DNA/Pilares/P5-*
      - camada de persistência/serialização de Trace/Feedback
      - componentes de UI que exibem traces/feedback
    criterios_aceite:
      - "Lista de campos sensíveis por objeto publicada."
      - "Redaction aplicada em gravação e exibição; testes com dados sensíveis simulados."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 7/Capitulo 7.md
      resumo_para_ace: >
        Aplique Pilares P2/P4/P5/P6 à definição de PII; nenhum campo proibido vai para UI/log bruto.

  - id: S36-BE-010
    wave: W1
    area: backend
    gate_relacionado: S36_G1
    descricao: "Criar/ajustar repositórios/serviços para escrita/leitura de Trace/Feedback com PII/retention embutidos."
    arquivos_alvo:
      - app/agents/trace_repository.py
      - app/feedback/repository.py
    criterios_aceite:
      - "APIs internas prontas para uso por instrumentação e UI."
      - "Redaction/retention aplicados por padrão."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 4/Bloco 4.md
      resumo_para_ace: >
        Não deixe cada call de logging cuidar de PII; centralize na camada de persistência.

  - id: S36-BE-020
    wave: W2
    area: backend
    gate_relacionado: S36_G1
    descricao: "Instrumentar pipeline ContentItem→Claim/Entidade para gerar ReasoningSteps/AgentTrace em domínios piloto."
    arquivos_alvo:
