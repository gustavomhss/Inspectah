  - id: S36-BE-001
    wave: W0
    area: backend
    gate_relacionado: S36_G0
    descricao: "Refinar modelo canônico de objetos de trace/feedback alinhando Cap.3/Bloco 2 e contratos P2→E40.5."
    arquivos_alvo:
      - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 3/Bloco 2.md
      - docs/architecture/p2_s36_trace_model_v1.md
    criterios_aceite:
