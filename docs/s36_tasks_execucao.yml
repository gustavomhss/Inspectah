        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 2/Capitulo 2.md
      resumo_para_ace: >
        Use esses scripts como fonte de verdade para G1/G2; evite contar na mão.

  - id: S36-QA-011
    wave: W2
    area: qa_performance
    gate_relacionado: S36_G1
    descricao: "Medir overhead de logging (latência/throughput/volume) e ajustar granularidade se necessário."
    arquivos_alvo:
