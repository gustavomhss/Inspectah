      - "Script de trace_link_break_rate produz valor ≈0 (com exceções justificadas)."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 2/Capitulo 2.md
      resumo_para_ace: >
        Trate links quebrados como bug de S36, não como “exceção natural”.

  - id: S36-QA-010
    wave: W2
    area: qa_dados
    gate_relacionado: S36_G1
    descricao: "Implementar scripts para trace_coverage_rate e avg_trace_depth por domínio/tipo de decisão."
    arquivos_alvo:
