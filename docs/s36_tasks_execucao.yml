    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 36/Capitulo 9/Capitulo 9.md
      resumo_para_ace: >
        Formulário precisa ser rápido de usar; evite campos desnecessários.

  - id: S36-BE-023
    wave: W3
    area: backend
    gate_relacionado: S36_G3
    descricao: "Persistir FeedbackOnTrace/FeedbackOnDecision com integridade referencial e trilha de autoria/tempo."
