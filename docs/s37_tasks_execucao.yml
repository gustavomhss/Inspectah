sprint: S37
programa: "2, 3, 4"
epico: "P2-E3 (ClaimGraph), P2-E5 (Motor Sinais), P3-E1 (Truth Policy DSL), P3-E6 (Guardião)"

ace_resumo:
  objetivo_sprint: >
    Integrar componentes de interpretação com núcleo lógico: ClaimGraph organizando narrativas,
    Motor de Sinais agregando diagnósticos, Truth Policy DSL habilitando políticas declarativas,
    e Guardião v0 orquestrando comitês — com SLAs de Decisão ≤20s, Reversão ≤10%, Abuso ≤5%.
  leitura_minima_spec:
    - docs/Agents/Planejamento/Programa 2/Sprint 37/S37_spec.md
    - docs/Agents/Planejamento/Programa 2 - Interpretacao, claims, entidades, sinais.md
    - docs/Agents/Planejamento/Programa 3 - Truth DB, sistema de blocos, logica, memoria, contestacaomd.md
    - docs/Agents/Planejamento/Programa 4 - Exposica, produtos, apis.md
  instrucoes_para_ace: >
    Trabalhe wave a wave. S37 assume S36 entregue (traces, feedback, schemas base).
    Foco em integração entre P2/P3/P4, não em retrabalho de fundações.
    G5-G9 exigem evidências reais (grafos, sinais, policies, métricas).

waves:
  - id: W0
    nome: "ClaimGraph modelo e persistência"
    descricao: "Definir modelo de grafo, schemas, índices e operações básicas para claims/entidades/relações."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 37/S37_spec.md#3.1
        - docs/Agents/Planejamento/Programa 2 - Interpretacao, claims, entidades, sinais.md
      resumo_para_ace: >
        Criar estrutura de grafo com nós (claims, entidades, casos) e arestas (apoio, oposição,
        temporalidade, causalidade). Persistência em DB com índices para queries frequentes.
      observacoes_execucao: >
        Não otimizar prematuramente. Foco em modelo correto e operações básicas funcionando.

  - id: W1
    nome: "Motor de Sinais batch"
    descricao: "Implementar cálculo periódico de 4 sinais agregados sobre ClaimGraph."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 37/S37_spec.md#3.2
        - docs/DNA/Guias/Tensor_Deformacao_Semantica/
      resumo_para_ace: >
        Sinais: mentiras_em_circulacao, campo_batalha, radar_silencio, fragilidade_narrativa.
        Batch 1h, persistir snapshots, expor métricas para Guia 2 (entropia).
      observacoes_execucao: >
        Começar com queries simples sobre ClaimGraph. Thresholds configuráveis por domínio.

  - id: W2
    nome: "Truth Policy DSL v1"
    descricao: "Parser e executor de linguagem declarativa para políticas de decisão por domínio."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 37/S37_spec.md#3.3
        - docs/Agents/Planejamento/Programa 3 - Truth DB, sistema de blocos, logica, memoria, contestacaomd.md
      resumo_para_ace: >
        DSL com POLICY, DOMAIN, GATE, REQUIRE, ON...THEN. Parser valida sintaxe,
        executor aplica regras em E40.5. Versionamento de policies obrigatório.
      observacoes_execucao: >
        DSL simples primeiro. Não implementar herança/composição (S38+).

  - id: W3
    nome: "Guardião v0 e integração E40.5"
    descricao: "Orquestrador de comitês com papéis, fluxo de validação e integração com E40.5."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 37/S37_spec.md#3.4
        - docs/DNA/Guias/Maquina_Adiabatica_de_Consenso/
      resumo_para_ace: >
        Papéis: Proponente, Validadores, Revisor, Árbitro. Fluxo: submissão → policy →
        E40.5 → quórum → human_review (se necessário) → DecisionBlock.
      observacoes_execucao: >
        Métricas de latência são críticas (target ≤20s). Implementar timeouts e fallbacks.

  - id: W4
    nome: "API Gateway, Cockpit e Fact Cards"
    descricao: "Expor ClaimGraph, sinais e estados via APIs; UIs de Cockpit e Fact Cards v0."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 37/S37_spec.md
        - docs/Agents/Planejamento/Programa 4 - Exposica, produtos, apis.md
      resumo_para_ace: >
        API Gateway com rotas, auth, rate limiting básico. Cockpit Casos com claims/sinais.
        Fact Cards com MQV/entropia/tensor e disclaimers por domínio.
      observacoes_execucao: >
        Contratos de API devem declarar source.guia conforme P4 regras de exposição.

  - id: W5
    nome: "Métricas, ORR e GO/NO-GO"
    descricao: "Consolidar métricas G5-G9, executar ORR e documentar GO/NO-GO."
    ace_context:
      spec_refs:
        - docs/Agents/Planejamento/Programa 2/Sprint 37/S37_spec.md#4
      resumo_para_ace: >
        Verificar todos os gates, coletar métricas, revisar qualidade, executar ORR.
        Documentar riscos remanescentes e itens para S38.
      observacoes_execucao: >
        Use scripts para métricas automatizadas. ORR deve ter evidências concretas.

