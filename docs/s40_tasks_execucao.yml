    Tornar o Truth-DB estável em piloto: DecisionBlocks válidos com provenance,
    E40.5 obrigatório, export P2→P3 sem cola manual, e Truth Twin expondo tudo.
  leitura_minima:
    - docs/s40_cap_4_4_tasks_e_waves.md
    - docs/Agents/Planejamento/Programa 2/Sprint 40/S40_spec.md
    - docs/Agents/Planejamento/Programa 2/Sprint 40/Capitulo 2/Bloco 2.md
  instrucoes:
    - Seguir waves em ordem (W0 → W5)
    - Cada task tem DONE explícito; não marcar completa sem evidência
    - Reportar gaps imediatamente se task impossível
    - Cobertura de testes ≥97% obrigatória

