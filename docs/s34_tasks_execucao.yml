  - id: S34-OBS-030
    wave: W3
    area: observabilidade
    gate_relacionado: S34_G3
    descricao: "Instrumentar métricas/logs por fluxo/versão e criar painel s34_flow_ops_overview + alertas s34."
    arquivos_alvo:
