sprint: S34
programa: 1
epico: 28

ace_resumo:
  objetivo_sprint: >
    Entregar fluxos governáveis multi-domínio (notícias + contestação v0) com templates/políticas versionados,
    console/API multi-fluxo, SLO/incident/observabilidade por flow_id/flow_version_id e operação 24/7 com evidências/bundle (G0–G5 verdes).
  leitura_minima_spec:
    - Programa 1/Epico 28/Sprint 34/Capitulo 1/Capitulo 1.md
    - Programa 1/Epico 28/Sprint 34/Capitulo 2/Capitulo 2.md
    - Programa 1/Epico 28/Sprint 34/Capitulo 3/Capitulo 3.md
    - Programa 1/Epico 28/Sprint 34/Capitulo 4/Capitulo 4.md
  instrucoes_para_ace: >
    Trabalhe wave a wave usando apenas o ace_context da wave/task atual.
    Não invente fluxos/SLOs fora do recorte (notícias + contestação v0).
    Indicadores/alertas fake são proibidos; bundle multi-fluxo é obrigatório.

waves:
  - id: W0
    nome: "Grounding & G0"
    descricao: "Fechar recorte multi-fluxo, templates, limites/flags e SLO map; script G0."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 34/Capitulo 2/Bloco 1.md
        - config/flow_templates/news_v2.yaml
        - config/flow_templates/contestacao_v0.yaml
        - config/flows_limits.yaml
        - config/feature_flags.yaml
      resumo_para_ace: >
        Valide que templates, limites e flags existem e que o mapa de componentes/SLO S34 está consistente.
        Rode G0 para gerar scorecard.
      observacoes_execucao: >
        Não codar console aqui; foco em recorte/arquivos e script G0.

  - id: W1
    nome: "Modelo/Políticas (G1)"
    descricao: "Migração/entidades multi-fluxo, loader de templates, políticas mínimas e limites/flags aplicados."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 34/Capitulo 2/Bloco 2.md
        - Programa 1/Epico 28/Sprint 34/Capitulo 3/Capitulo 3.md
      resumo_para_ace: >
        Aplique migração 0034, implemente modelos/versionamento/policy engine e enforcement de limites/flags.
        Teste invariantes (flow_id/version obrigatório, rollback gated, limites).
      observacoes_execucao: >
        Rodar G1 em DB limpo e pós-S32. Falhas de invariante são STOP.

  - id: W2
    nome: "Console/API & OracleOps v2 (G2)"
    descricao: "Console/API multi-fluxo (histórico/diffs/rollback) com RBAC + cockpit OracleOps exibindo fluxos/versões/SLO/incident."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 34/Capitulo 2/Bloco 3.md
        - Programa 1/Epico 28/Sprint 34/Capitulo 3/Capitulo 3.md
      resumo_para_ace: >
        Implementar rotas e UI multi-fluxo, com dados reais/fixtures, diffs/rollback/test, RBAC.
        Cockpit deve mostrar fluxos/versões com SLO/incident.
      observacoes_execucao: >
        IDs precisam bater com mapa. Sem estados hardcoded. G2 script valida recorte e 2xx.

  - id: W3
    nome: "Observabilidade & SLO (G3)"
    descricao: "Métricas/logs/alertas por fluxo/versão/teste; painel s34_flow_ops_overview; SLOs versionados no cockpit."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 34/Capitulo 2/Bloco 3.md
        - observability/dashboards/s34_flow_ops_overview.json
        - observability/alerts/s34/
      resumo_para_ace: >
        Emitir métricas (exec_total/latency/policy violations/rollback), configurar alertas e expor estados SLO no cockpit.
        Painel não pode estar vazio; queries/alerts versionados.
      observacoes_execucao: >
        Simule violações para validar alertas/estado. G3 script deve confirmar métricas/alerts/painel.

  - id: W4
    nome: "Pilotos + Evidência (G4)"
    descricao: "Executar pilotos (notícias e contestação v0) em teste/ativo, rollback, coletar evidências e bundle parcial."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 34/Capitulo 4/Capitulo 4.md
        - Programa 1/Epico 28/Sprint 34/Capitulo 5/Capitulo 5.md
      resumo_para_ace: >
        Rodar fluxos governados, testar rollback, coletar dataset/ingest_log/exec_dump/metrics/logs/screenshots.
        Scripts de gates, metrics summary e bundle parcial devem rodar.
      observacoes_execucao: >
        Evidências precisam cobrir ambos fluxos. Workflow s34-gates.yml deve estar verde.

  - id: W5
    nome: "ORR & Bundle final (G5)"
    descricao: "Conduzir ORR operacional G0–G4, gerar scorecard final e bundle completo."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 34/Capitulo 5/Capitulo 5.md
        - Programa 1/Epico 28/Sprint 34/Capitulo 6/Capitulo 6.md
      resumo_para_ace: >
        Rodar ORR com bundle/scorecards/metrics_summary; registrar GO/NO-GO e riscos.
        Empacotar inspectah_s34_evidence_bundle.zip com scorecards/evidências.
      observacoes_execucao: >
        Sem bundle íntegro, sem GO. Registrar notas em out/evidence/S34_ORR_summary.txt.

tasks:
  - id: S34-DOC-000
    wave: W0
    area: docs
    gate_relacionado: S34_G0
    descricao: "Consolidar recorte S34 (fluxos notícias + contestação v0), templates e SLO map."
    arquivos_alvo:
      - Programa 1/Epico 28/Sprint 34/Capitulo 1/*
      - Programa 1/Epico 28/Sprint 34/Capitulo 2/Bloco 1.md
      - config/flow_templates/news_v2.yaml
      - config/flow_templates/contestacao_v0.yaml
      - config/flows_limits.yaml
      - config/feature_flags.yaml
    criterios_aceite:
      - "Templates existem e estão alinhados ao recorte."
      - "Limites/flags definidos; SLO map referenciado."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 34/Capitulo 2/Bloco 1.md
      resumo_para_ace: >
        Feche o recorte antes de G1. Sem templates/limits/flags, não siga.

  - id: S34-CI-001
    wave: W0
    area: ci/orr
    gate_relacionado: S34_G0
    descricao: "Script G0 (`bin/s34_g0_scope.sh`) validando templates/limits/flags/SLO map e gerando scorecard."
    arquivos_alvo:
      - bin/s34_g0_scope.sh
      - out/scorecards/S34_G0_scope.json
      - out/evidence/S34_G0_scope_and_templates/
    criterios_aceite:
      - "Script roda e checa consistência; scorecard PASS/WARN justificado."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 34/Capitulo 2/Bloco 1.md
      resumo_para_ace: >
        Automatize checagens básicas; sem scorecard, não avança.

  - id: S34-BE-010
    wave: W1
    area: backend
    gate_relacionado: S34_G1
    descricao: "Implementar migração 0034 e modelos/versionamento/policy engine multi-fluxo; loader de templates."
    arquivos_alvo:
      - migrations/versions/0034_s34_flow_multidomain_ops.py
      - app/flows/models.py
      - app/flows/versioning.py
      - app/flows/policy_engine.py
      - app/flows/templates/loader.py
    criterios_aceite:
      - "Migração aplica em DB limpo e pós-S32."
      - "Templates carregam; policies mínimas por domínio ativas."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 34/Capitulo 3/Capitulo 3.md
      resumo_para_ace: >
        Garanta flow_id/flow_version_id em execuções; política mínima por domínio.

  - id: S34-BE-011
    wave: W1
    area: backend
    gate_relacionado: S34_G1
    descricao: "Aplicar limites/flags (rollbacks/test percent/versions keep/timeout) nas operações de fluxo."
    arquivos_alvo:
      - app/flows/service.py
      - config/flows_limits.yaml
      - config/feature_flags.yaml
      - app/flows/ops_integration.py
    criterios_aceite:
      - "Operações respeitam limites; violações falham claramente."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 34/Capitulo 2/Bloco 2.md
      resumo_para_ace: >
        Enforce limites/flags em create/test/rollback. Logs claros em caso de violação.

  - id: S34-QA-012
    wave: W1
    area: testes
    gate_relacionado: S34_G1
    descricao: "Testes de políticas/invariantes (flow_id/version obrigatório, rollback gated, limites/flags, policy violations)."
    arquivos_alvo:
      - tests/flows/test_flow_models_and_policies.py
      - tests/flows/test_flow_limits.py
    criterios_aceite:
      - "Pytest verde cobrindo invariantes/limites."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 34/Capitulo 2/Bloco 2.md
      resumo_para_ace: >
        Simule violações para provar enforcement. Esses testes alimentam G1.

  - id: S34-CI-013
    wave: W1
    area: ci/orr
    gate_relacionado: S34_G1
    descricao: "Script G1 (`bin/s34_g1_model.sh`) rodando migração + testes e gerando scorecard."
    arquivos_alvo:
      - bin/s34_g1_model.sh
      - out/scorecards/S34_G1_model.json
      - out/evidence/S34_G1_model_and_policies_multifluxo/
    criterios_aceite:
      - "Script fim-a-fim; scorecard lista invariantes/limites checados."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 34/Capitulo 2/Bloco 2.md
      resumo_para_ace: >
        Automatize migração + pytest + checagens de limites. Scorecard obrigatório.

  - id: S34-BE-020
    wave: W2
    area: backend
    gate_relacionado: S34_G2
    descricao: "APIs de console multi-fluxo (histórico/diffs/rollback/teste) com RBAC e payloads com flow_id/version."
    arquivos_alvo:
      - app/api/flow_console_routes.py
      - app/flows/schemas.py
      - app/flows/service.py
    criterios_aceite:
      - "Rotas 2xx; histórico/diffs/rollback/teste funcionam; RBAC aplicado; IDs consistentes."
    ace_context:
      spec_refs:
        - Programa 1/Epico 28/Sprint 34/Capitulo 2/Bloco 3.md
      resumo_para_ace: >
        Integre rollback/teste e histórico de versões; proteja com autorização.

  - id: S34-FE-021
    wave: W2
    area: frontend
    gate_relacionado: S34_G2
