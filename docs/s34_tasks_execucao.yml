  - id: S34-OPS-022
    wave: W2
    area: observabilidade
    gate_relacionado: S34_G2
    descricao: "Integrar cockpit OracleOps v2 para exibir fluxos/versões/SLO/incident (mapa de componentes atualizado)."
    arquivos_alvo:
