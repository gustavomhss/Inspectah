  - id: S34-CI-024
    wave: W2
    area: ci/orr
    gate_relacionado: S34_G2
    descricao: "Script G2 (`bin/s34_g2_console.sh`) validando endpoints/recorte e gerando scorecard."
    arquivos_alvo:
