  - id: S34-QA-023
    wave: W2
    area: testes
    gate_relacionado: S34_G2
    descricao: "Testes API/UI de console multi-fluxo e integração OracleOps (recorte, RBAC, rollback/teste)."
    arquivos_alvo:
