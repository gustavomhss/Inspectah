name: Sprint 13 Gates

on:
  push:
    branches:
      - main
      - s13_piloto_multi_dominio_v0
  pull_request:
    branches:
      - main
      - s13_piloto_multi_dominio_v0

jobs:
  sprint13-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e .

      - name: Run Sprint 13 gates
        run: |
          export PYTHONPATH=.
          bin/s13_gates_all.sh

      - name: Upload scorecards and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint13-gates-artifacts
          path: |
            out/scorecards
            out/evidence
