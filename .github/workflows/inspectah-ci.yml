name: Inspectah Core Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core-gates:
    runs-on: ubuntu-latest
    env:
      NET: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e .

      - name: Run Sprint 3 ORR
        run: |
          . .venv/bin/activate
          export PYTHONPATH=.
          bin/orr_all.sh

      - name: Run Sprint 5 G3 gate
        run: |
          . .venv/bin/activate
          export PYTHONPATH=.
          bin/s5_gate_g3_pipeline_fixtures.sh

      - name: Run Sprint 6 gates
        run: |
          . .venv/bin/activate
          export PYTHONPATH=.
          # Collect canonical data for Sprint 6 before running the gates
          python -m inspectah.sprint6.cli collect
          bin/s6_g4_explore_verify.sh

      - name: Run Sprint 7 gates
        run: |
          . .venv/bin/activate
          export PYTHONPATH=.
          bin/s7_g4_ui_query_consolidation.sh

      - name: Run Sprint 9 CI
        run: |
          . .venv/bin/activate
          export PYTHONPATH=.
          bin/s9_ci.sh

      - name: Upload scorecards and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-gates-artifacts
          path: |
            out/scorecards
            out/evidence
