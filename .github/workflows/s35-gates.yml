name: s35-gates

on:
  workflow_dispatch:

jobs:
  g2-g3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest prometheus-client
      - name: Run G2
        run: bin/s35_g2_console.sh
      - name: Run G3
        run: bin/s35_g3_obs.sh
