name: Coverage Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      NET: 0
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e .
          pip install pytest-cov

      - name: Run tests with coverage
        run: |
          . .venv/bin/activate
          PYTHONPATH=. python -m pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=97

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

      - name: Coverage Summary
        if: always()
        run: |
          . .venv/bin/activate
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          PYTHONPATH=. python -m pytest --cov=app --cov-report=term 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY
