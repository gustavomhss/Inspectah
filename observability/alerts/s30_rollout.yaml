groups:
  - name: s30_rollout_alerts
    rules:
      - alert: S30_RollbackRateHigh
        expr: sum by(flow_id, flow_version_id, mode) (increase(inspectah_flow_rollout_rollback_total[15m])) > 0
        for: 1m
        labels:
          severity: warning
          gate: G1
        annotations:
          summary: "Rollbacks detectados em rollout (S30)"
          description: "flow={{ $labels.flow_id }} version={{ $labels.flow_version_id }} mode={{ $labels.mode }} rollback > 0 em 15m"

      - alert: S30_PolicyViolationCanary
        expr: sum by(flow_id, flow_version_id, mode) (increase(flow_policy_violations_total[10m])) > 0
        for: 1m
        labels:
          severity: critical
          gate: G1
        annotations:
          summary: "Policy violation em canário/teste (S30)"
          description: "flow={{ $labels.flow_id }} version={{ $labels.flow_version_id }} mode={{ $labels.mode }} registrou policy_violation"

      - alert: S30_CatalogHashDrift
        expr: sum by(flow_id, flow_version_id, mode) (increase(flow_catalog_hash_mismatch_total[10m])) > 0
        for: 1m
        labels:
          severity: critical
          gate: G1
        annotations:
          summary: "Hash drift de catálogo detectado (S30)"
          description: "flow={{ $labels.flow_id }} version={{ $labels.flow_version_id }} mode={{ $labels.mode }} com mismatch de catálogo"

      - alert: S30_SloBreach
        expr: sum by(flow_id, flow_version_id) (increase(inspectah_flow_slo_breach_total[15m])) > 0
        for: 1m
        labels:
          severity: critical
          gate: G3
        annotations:
          summary: "SLO breach detectado (S30)"
          description: "flow={{ $labels.flow_id }} version={{ $labels.flow_version_id }} possui slo_breach em 15m"

      - alert: S30_IngestErrorsHigh
        expr: |
          sum by(source_id) (increase(newsdata_ingest_errors_total[15m]))
          /
          clamp_min(sum by(source_id) (increase(newsdata_ingest_requests_total[15m])), 1)
          > 0.05
        for: 2m
        labels:
          severity: warning
          gate: G1
        annotations:
          summary: "Taxa de erro de ingestão >5% (S30)"
          description: "source={{ $labels.source_id }} erros >5% em 15m"

      - alert: S30_IngestRequestsZero
        expr: sum by(source_id) (increase(newsdata_ingest_requests_total[30m])) == 0
        for: 2m
        labels:
          severity: warning
          gate: G1
        annotations:
          summary: "Ingestão sem requests em 30m (S30)"
          description: "source={{ $labels.source_id }} sem ingest requests em 30m"

      - alert: S30_IngestItemsFlat
        expr: sum by(source_id) (increase(newsdata_items_ingested_total[30m])) == 0
        for: 2m
        labels:
          severity: warning
          gate: G1
        annotations:
          summary: "Itens ingeridos zerados em 30m (S30)"
          description: "source={{ $labels.source_id }} sem itens em 30m"

      - alert: S30_DashboardFreshness
        expr: time() - max without() (timestamp(inspectah_flow_rollout_requests_total)) > 300
        for: 1m
        labels:
          severity: warning
          gate: G1
        annotations:
          summary: "Painel/metricas desatualizadas (S30)"
          description: "Último scrape /metrics >5m"
