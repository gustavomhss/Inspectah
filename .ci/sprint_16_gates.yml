name: sprint_16_gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  s16-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run Sprint 16 gates T0-T4
        run: |
          ./bin/s16_t0_sanity.sh
          ./bin/s16_t1_threat_model.sh
          ./bin/s16_t2_attack_scenarios.sh
          ./bin/s16_t3_debunker_and_committees_under_attack.sh
          ./bin/s16_t4_anchors_and_anti_canetada.sh
      - name: Upload scorecards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s16-scorecards
          path: out/scorecards
