name: sprint_15_gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  s15-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run Sprint 15 gates T0-T7
        run: |
          ./bin/s15_t0_sanity.sh
          ./bin/s15_t1_contracts_and_states.sh
          ./bin/s15_t2_debunker_offline.sh
          ./bin/s15_t3_committees_flow.sh
          ./bin/s15_t4_golden_scenarios.sh
          ./bin/s15_t5_performance_and_cost.sh
          ./bin/s15_t6_observability.sh
          ./bin/s15_t7_ci_and_repro.sh
      - name: Upload scorecards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s15-scorecards
          path: out/scorecards
