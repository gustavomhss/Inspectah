name: sprint_17_1_nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  s17-1-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run Sprint 17.1 full gates
        run: ./bin/s17_1_all_gates.sh
      - name: Upload scorecards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s17-1-nightly-scorecards
          path: out/scorecards
