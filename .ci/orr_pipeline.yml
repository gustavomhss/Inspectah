version: 1
name: orr_pipeline
on:
  push:
    branches:
      - main
      - sprint/*
  pull_request:

jobs:
  orr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run ORR (T0-T6)
        env:
          ORR_OUTDIR: out
        run: |
          source .venv/bin/activate
          chmod +x bin/orr_all.sh
          bin/orr_all.sh
      - name: Archive scorecards & evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orr-artifacts
          path: |
            out/scorecards
            out/evidence/T7_orr_pipeline
