name: sprint_17_gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  s17-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend deps
        run: |
          cd frontend/inspectah-ui
          npm ci
      - name: Run Sprint 17 gates T0-T7
        run: |
          ./bin/s17_t0_sanity.sh
          ./bin/s17_t1_contracts_and_states.sh
          ./bin/s17_t2_ux_and_accessibility.sh
          ./bin/s17_t3_api_integration.sh
          ./bin/s17_t4_golden_flows.sh
          ./bin/s17_t5_performance_and_bundle.sh
          ./bin/s17_t6_frontend_observability.sh
          ./bin/s17_t7_ci_and_repro.sh
      - name: Upload scorecards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s17-scorecards
          path: out/scorecards
