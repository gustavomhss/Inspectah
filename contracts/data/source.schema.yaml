{
  "$id": "https://inspectah.local/schemas/source.json",
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "Inspectah Source",
  "type": "object",
  "required": [
    "name",
    "kind",
    "endpoint",
    "allowlist_proof",
    "robots_status"
  ],
  "properties": {
    "id": {
      "type": "string"
    },
    "name": {
      "type": "string"
    },
    "kind": {
      "type": "string",
      "enum": [
        "rss",
        "api"
      ]
    },
    "endpoint": {
      "type": "string",
      "format": "uri"
    },
    "poll_interval_seconds": {
      "type": "integer",
      "minimum": 60
    },
    "rate_limit_per_minute": {
      "type": "integer",
      "minimum": 1
    },
    "auth": {
      "type": "object",
      "properties": {
        "type": {
          "type": "string",
          "enum": [
            "none",
            "basic",
            "bearer"
          ]
        },
        "basic": {
          "type": "object",
          "properties": {
            "username": {
              "type": "string"
            },
            "password_ref": {
              "type": "string"
            }
          }
        },
        "bearer": {
          "type": "object",
          "properties": {
            "token_ref": {
              "type": "string"
            }
          }
        }
      }
    },
    "allowlist_proof": {
      "type": "object",
      "required": [
        "domain",
        "tos_hash",
        "fetched_at"
      ],
      "properties": {
        "domain": {
          "type": "string"
        },
        "tos_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        },
        "fetched_at": {
          "type": "string",
          "format": "date-time"
        }
      }
    },
    "robots_status": {
      "type": "object",
      "required": [
        "hash",
        "checked_at"
      ],
      "properties": {
        "hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        },
        "checked_at": {
          "type": "string",
          "format": "date-time"
        }
      }
    },
    "extractor_version": {
      "type": "integer",
      "minimum": 1
    },
    "fields": {
      "type": "array",
      "minItems": 1,
      "items": {
        "type": "object",
        "required": [
          "name",
          "path",
          "type"
        ],
        "properties": {
          "name": {
            "type": "string"
          },
          "path": {
            "type": "string"
          },
          "type": {
            "type": "string",
            "enum": [
              "string",
              "number",
              "integer",
              "boolean",
              "timestamp",
              "enum",
              "array"
            ]
          },
          "transforms": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "enum": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "regex": {
            "type": "string"
          },
          "required": {
            "type": "boolean",
            "default": false
          }
        }
      }
    },
    "flags": {
      "type": "array",
      "items": {
        "type": "string"
      }
    },
    "created_at": {
      "type": "string",
      "format": "date-time"
    },
    "updated_at": {
      "type": "string",
      "format": "date-time"
    }
  }
}