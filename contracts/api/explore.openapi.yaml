{
  "openapi": "3.0.3",
  "info": {
    "title": "Inspectah Explore API",
    "version": "0.1.0"
  },
  "servers": [
    {
      "url": "https://inspectah.local/api"
    }
  ],
  "components": {
    "schemas": {
      "ExploreQuery": {
        "type": "object",
        "properties": {
          "source_id": {
            "type": "string"
          },
          "q": {
            "type": "string"
          },
          "time_range": {
            "type": "object",
            "properties": {
              "from": {
                "type": "string",
                "format": "date-time"
              },
              "to": {
                "type": "string",
                "format": "date-time"
              }
            }
          },
          "page": {
            "type": "integer",
            "minimum": 1,
            "default": 1
          },
          "page_size": {
            "type": "integer",
            "minimum": 1,
            "maximum": 200,
            "default": 50
          },
          "sort": {
            "type": "string",
            "enum": [
              "indexed_at_desc",
              "indexed_at_asc"
            ],
            "default": "indexed_at_desc"
          }
        }
      },
      "EvidenceRef": {
        "type": "object",
        "required": [
          "manifest_path",
          "payload_path",
          "manifest_sha256",
          "payload_sha256"
        ],
        "properties": {
          "manifest_path": {
            "type": "string"
          },
          "payload_path": {
            "type": "string"
          },
          "manifest_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "payload_sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          }
        }
      },
      "ExploreItem": {
        "type": "object",
        "required": [
          "item_id",
          "source_id",
          "canonical_url",
          "title",
          "event_time",
          "observed_at",
          "indexed_at",
          "fields",
          "evidence"
        ],
        "properties": {
          "item_id": {
            "type": "string"
          },
          "source_id": {
            "type": "string"
          },
          "canonical_url": {
            "type": "string",
            "format": "uri"
          },
          "title": {
            "type": "string"
          },
          "excerpt": {
            "type": "string"
          },
          "event_time": {
            "type": "string",
            "format": "date-time"
          },
          "observed_at": {
            "type": "string",
            "format": "date-time"
          },
          "indexed_at": {
            "type": "string",
            "format": "date-time"
          },
          "fields": {
            "type": "object",
            "additionalProperties": true
          },
          "evidence": {
            "$ref": "#/components/schemas/EvidenceRef"
          }
        }
      },
      "ExploreResponse": {
        "type": "object",
        "required": [
          "items",
          "page",
          "page_size",
          "total"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ExploreItem"
            }
          },
          "page": {
            "type": "integer"
          },
          "page_size": {
            "type": "integer"
          },
          "total": {
            "type": "integer"
          }
        }
      },
      "ExploreExportRequest": {
        "allOf": [
          {
            "$ref": "#/components/schemas/ExploreQuery"
          },
          {
            "type": "object",
            "required": [
              "format"
            ],
            "properties": {
              "format": {
                "type": "string",
                "enum": [
                  "csv",
                  "json"
                ]
              }
            }
          }
        ]
      },
      "ExploreExportResponse": {
        "type": "object",
        "required": [
          "format",
          "artifact_path",
          "checksum"
        ],
        "properties": {
          "format": {
            "type": "string"
          },
          "artifact_path": {
            "type": "string"
          },
          "checksum": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          }
        }
      }
    }
  },
  "paths": {
    "/explore": {
      "get": {
        "summary": "List indexed items with filters",
        "operationId": "listItems",
        "parameters": [
          {
            "name": "source_id",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "from",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "to",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1
            }
          },
          {
            "name": "page_size",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200,
              "default": 50
            }
          },
          {
            "name": "sort",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "indexed_at_desc",
                "indexed_at_asc"
              ],
              "default": "indexed_at_desc"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "List of items",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ExploreResponse"
                }
              }
            }
          },
          "400": {
            "description": "Invalid query"
          }
        }
      }
    },
    "/explore/export": {
      "post": {
        "summary": "Export query results as CSV/JSON",
        "operationId": "exportItems",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ExploreExportRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Export scheduled",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ExploreExportResponse"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request"
          }
        }
      }
    }
  }
}