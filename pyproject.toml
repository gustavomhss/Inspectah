[project]
name = "inspectah"
version = "0.1.0"
description = "Inspectah D8 vertical slice"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.30.0",
  "sqlmodel>=0.0.14",
  "pyyaml>=6.0",
  "prometheus-client>=0.19.0",
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.6"
]

[project.optional-dependencies]
dev = [
  "pytest"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
norecursedirs = ["Arquivo", ".git", ".venv", "node_modules"]
addopts = [
  "--ignore=tests/s8_t2_unit_contracts",
  "--ignore=tests/s8_t4_golden_flows",
]
